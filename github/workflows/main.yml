name: Executive KPI Warehouse Pipeline
on:
  workflow_dispatch:
  schedule:
        - cron: '0 7 * * *'
jobs:
  warehouse:
    runs-on: ubuntu-latest
    steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-python@v4
        with:
          python-version: '3.10'
            - run: pip install -r requirements.txt
            - run: mkdir -p metrics
            - run: python src/generate_kpi_warehouse.py
            - run: python src/build_metrics.py
