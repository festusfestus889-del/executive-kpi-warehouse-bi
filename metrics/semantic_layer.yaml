metrics:
  revenue:
    sql: SUM(revenue_ngn)
    description: "Gross revenue, no refunds"
    owner: "finance@company.com"
  active_users:
    sql: SUM(active_users)
    description: "Users with 1+ transaction"
  churn_rate:
    sql: "SUM(churned_users) / NULLIF(SUM(active_users),0)"
    description: "Churn = churned / active. Target <5%"
    target: 0.05
  activation_rate:
    sql: "SUM(activated_users) / NULLIF(SUM(active_users),0)"
    description: "KYC + first transaction in 7 days"
    target: 0.65
  arpu:
    sql: "SUM(revenue_ngn) / NULLIF(SUM(active_users),0)"
    description: "Average Revenue Per User"
dimensions:
    - segment
    - region
    - month
    - product
